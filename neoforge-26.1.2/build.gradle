plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}

sourceSets.test.java.srcDir '../common/src/test/java'

repositories {
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeModule 'maven.modrinth', 'jade'
            includeModule 'maven.modrinth', 'the-one-probe'
        }
    }
    maven {
        url = 'https://maven2.bai.lol'
        content { includeModule 'mcp.mobius.waila', 'wthit-api' }
    }
}

dependencies {
    compileOnly 'mezz.jei:jei-26.1.2-common-api:29.47.0.110'
    compileOnly 'mezz.jei:jei-26.1.2-neoforge-api:29.47.0.110'
    compileOnly 'maven.modrinth:jade:Pr1h4azo'
    compileOnly 'mcp.mobius.waila:wthit-api:neo-19.0.1'
    compileOnly 'maven.modrinth:the-one-probe:NOrwYJkt'
    testImplementation(enforcedPlatform('org.junit:junit-bom:5.14.1'))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.neoforged:testframework:${neo_version}"
}

test { useJUnitPlatform() }

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neo_version


    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}
neoForge.unitTest {
    enable()
    testedMod = neoForge.mods.gash_super_pylons
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    def properties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_license: mod_license,
        mod_description: mod_description,
        minecraft_version: minecraft_version,
        neo_version: neo_version
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
            'Implementation-Title': mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors
        )
    }
}
