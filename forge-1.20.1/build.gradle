plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

sourceSets.main {
    java.srcDir '../common/src/main/java'
    java.srcDir '../common/src/ponderContent/java'
    java.srcDir '../common/src/ponder/java'
    resources.srcDir '../common/src/main/resources'
}

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    maven {
        url = 'https://maven.createmod.net'
        content { includeGroup 'net.createmod.ponder' }
    }
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeModule 'maven.modrinth', 'jade'
            includeModule 'maven.modrinth', 'the-one-probe'
        }
    }
    maven {
        url = 'https://maven2.bai.lol'
        content { includeModule 'mcp.mobius.waila', 'wthit-api' }
    }
}

dependencies {
    compileOnly(fg.deobf('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91') { transitive = false })
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.74.0.234')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.74.0.234')
    compileOnly fg.deobf('maven.modrinth:jade:xJQHCmWJ')
    compileOnly fg.deobf('mcp.mobius.waila:wthit-api:forge-8.21.1')
    compileOnly fg.deobf('maven.modrinth:the-one-probe:e3jbQNls')
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    def properties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_license: mod_license,
        mod_description: mod_description,
        minecraft_version: minecraft_version,
        forge_version: forge_version
    ]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
            'Implementation-Title': mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors
        )
    }
    finalizedBy 'reobfJar'
}
