name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: forge-1.20.1
            java: '17'
          - module: neoforge-1.21.1
            java: '21'
          - module: neoforge-26.1.2
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build
        working-directory: ${{ matrix.module }}
        run: bash ./gradlew build --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: gash_super_pylons-${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
